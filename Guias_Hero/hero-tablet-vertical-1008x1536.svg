<svg xmlns="http://www.w3.org/2000/svg" width="1008" height="1536" viewBox="0 0 1008 1536" role="img" aria-labelledby="title desc">
  <title id="title">Guia Hero Tablet Vertical 1008x1536</title>
  <desc id="desc">Template com linhas guias para a imagem de fundo tablet vertical do hero.</desc>
  <defs>
    <style>
      .bg { fill: #080807; }
      .grid { stroke: rgba(255,255,255,.14); stroke-width: 2; }
      .third { stroke: #f4d16b; stroke-width: 4; stroke-dasharray: 18 12; }
      .center { stroke: #ffffff; stroke-width: 4; stroke-dasharray: 10 12; }
      .crop { fill: rgba(255,69,69,.16); stroke: rgba(255,69,69,.7); stroke-width: 2; }
      .text-safe { fill: rgba(68,190,255,.18); stroke: #44beff; stroke-width: 5; }
      .visual-safe { fill: rgba(244,209,107,.18); stroke: #f4d16b; stroke-width: 5; }
      .label { font: 700 30px Arial, sans-serif; fill: #ffffff; }
      .small { font: 500 23px Arial, sans-serif; fill: rgba(255,255,255,.84); }
      .tiny { font: 500 20px Arial, sans-serif; fill: rgba(255,255,255,.72); }
      .outline { fill: none; stroke: #ffffff; stroke-width: 7; }
    </style>
    <pattern id="gridPattern" width="84" height="84" patternUnits="userSpaceOnUse">
      <path d="M 84 0 L 0 0 0 84" fill="none" class="grid"/>
    </pattern>
  </defs>

  <rect width="1008" height="1536" class="bg"/>
  <rect width="1008" height="1536" fill="url(#gridPattern)"/>

  <rect x="0" y="0" width="60" height="1536" class="crop"/>
  <rect x="948" y="0" width="60" height="1536" class="crop"/>
  <rect x="0" y="0" width="1008" height="96" class="crop"/>
  <rect x="0" y="1440" width="1008" height="96" class="crop"/>

  <line x1="336" y1="0" x2="336" y2="1536" class="third"/>
  <line x1="672" y1="0" x2="672" y2="1536" class="third"/>
  <line x1="0" y1="512" x2="1008" y2="512" class="third"/>
  <line x1="0" y1="1024" x2="1008" y2="1024" class="third"/>
  <line x1="504" y1="0" x2="504" y2="1536" class="center"/>
  <line x1="0" y1="768" x2="1008" y2="768" class="center"/>

  <rect x="72" y="150" width="560" height="650" rx="20" class="text-safe"/>
  <text x="102" y="210" class="label">AREA SEGURA TEXTO</text>
  <text x="102" y="250" class="small">CSS: max-width 560px</text>
  <text x="102" y="285" class="small">Fundo deve continuar legivel</text>

  <rect x="500" y="80" width="360" height="720" rx="20" class="visual-safe"/>
  <text x="530" y="140" class="label">FOCO</text>
  <text x="530" y="180" class="small">Visual principal</text>
  <text x="530" y="215" class="small">Posicao: center top</text>

  <text x="60" y="1496" class="tiny">MARGEM VERMELHA = pode cortar no cover. Nao encostar rosto/produto nas bordas.</text>
  <text x="644" y="1496" class="tiny">1008 x 1536 | 2:3 aprox.</text>
  <rect x="4" y="4" width="1000" height="1528" class="outline"/>
</svg>
